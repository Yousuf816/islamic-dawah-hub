<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Crescent moon -->
  <text x="600" y="280" font-size="120" text-anchor="middle" fill="white" font-family="Arial, sans-serif">🌙</text>
  
  <!-- Title -->
  <text x="600" y="380" font-size="64" text-anchor="middle" fill="white" font-weight="bold" font-family="Arial, sans-serif">Light of Guidance</text>
  
  <!-- Subtitle -->
  <text x="600" y="440" font-size="32" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif">Islamic Dawah Platform</text>
  
  <!-- Tagline -->
  <text x="600" y="500" font-size="24" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif">Learn Islam with clarity and sincerity</text>
</svg>

