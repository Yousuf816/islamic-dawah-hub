name: Verify Deployment

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Verify Files
        run: |
          echo "Verifying required files..."
          test -f index.html && echo "✅ index.html exists" || exit 1
          test -f styles.css && echo "✅ styles.css exists" || exit 1
          test -f script.js && echo "✅ script.js exists" || exit 1
          test -f sw.js && echo "✅ sw.js exists" || exit 1
          test -f manifest.json && echo "✅ manifest.json exists" || exit 1
          test -f robots.txt && echo "✅ robots.txt exists" || exit 1
          test -f sitemap.xml && echo "✅ sitemap.xml exists" || exit 1
          echo "✅ All required files verified"
          
      - name: Validate JSON
        run: |
          echo "Validating JSON files..."
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))" && echo "✅ manifest.json is valid JSON" || exit 1
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))" && echo "✅ package.json is valid JSON" || exit 1
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))" && echo "✅ vercel.json is valid JSON" || exit 1
          node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'))" && echo "✅ firebase.json is valid JSON" || exit 1
          echo "✅ All JSON files validated"
          
      - name: Run Deployment Verification
        run: |
          if [ -f deploy-verify.js ]; then
            node deploy-verify.js
          else
            echo "⚠️ deploy-verify.js not found, skipping"
          fi

